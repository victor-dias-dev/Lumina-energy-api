# Render Blueprint - garante banco e API na mesma região (Oregon)
# https://render.com/docs/blueprint-spec
databases:
  - name: lumi-energy
    databaseName: lumi_energy
    user: lumi_energy
    region: oregon
    plan: free

services:
  - type: web
    name: lumi-energy-bill-api
    runtime: node
    region: oregon  # mesma região do banco (obrigatório para Internal URL)
    plan: free

    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run db:migrate && pnpm run start:prod

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-energy
          property: connectionString
      - key: NODE_ENV
        value: production
      # GEMINI_API_KEY e API_KEY devem ser adicionados manualmente como Secret
