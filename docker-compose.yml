services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi
      POSTGRES_DB: lumi_energy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi_energy"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lumi:lumi@db:5432/lumi_energy
      DATABASE_SSL: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
      SWAGGER_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
